# Secure Fog Computing Framework Simulation Configuration

# Topology configuration
topology.numIoTDevices=50
topology.numEdgeNodes=5
topology.numFogNodes=2

# Security configuration
security.securityEnabled=true
security.encryptionKeySize=128
security.authenticationEnabled=true
security.intrusionDetectionEnabled=true

# Simulation parameters
simulation.durationMs=10000
simulation.logLevel=INFO
simulation.resultsDirPath=results

# IoT device parameters
iot.dataGenerationRateWiFi=50.0
iot.dataGenerationRateBLE=15.0
iot.dataGenerationRateLoRaWAN=1.0
iot.energyConsumptionWiFi=0.05
iot.energyConsumptionBLE=0.02
iot.energyConsumptionLoRaWAN=0.01

# Edge node parameters
edge.processingCapacity=2000.0
edge.storageCapacity=1000.0
edge.availableBandwidth=100.0
edge.dataFilteringRatio=0.7

# Fog node parameters
fog.processingCapacity=5000.0
fog.storageCapacity=5000.0
fog.availableBandwidth=1000.0
fog.dataAnalyticsRatio=0.5

# Attack simulation
security.simulateAttacks=true
security.attackProbability=0.05
security.attackTypes=dataInjection,mitm,dos
