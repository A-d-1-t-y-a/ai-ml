# Simulation Configuration Properties
# Based on the paper: "An Overview of Fog Computing and Edge Computing Security and Privacy Issues"
# (Sensors 2021, 21, 8226, https://doi.org/10.3390/s21248226)

# Topology Configuration
num.iot.devices=20
num.edge.nodes=5
num.fog.nodes=2
simulation.steps=100

# Security Configuration
# Options: LOW, MEDIUM, HIGH, VERY_HIGH
security.level=MEDIUM
security.enabled.iot=true
security.enabled.edge=true
security.enabled.fog=true

# Attack Simulation Configuration
attack.simulation.enabled=true
# Options: ALL or comma-separated list of attack types
# Available types: IOT_PHYSICAL_TAMPERING, IOT_MALWARE_INJECTION, IOT_BATTERY_DRAINING, 
#                 EDGE_DOS, EDGE_MAN_IN_MIDDLE, EDGE_AUTHENTICATION_BYPASS,
#                 FOG_DATA_THEFT, FOG_PRIVILEGE_ESCALATION, FOG_VM_ESCAPE,
#                 NETWORK_EAVESDROPPING, NETWORK_TRAFFIC_ANALYSIS, NETWORK_ROUTING_ATTACK
attack.types=ALL
