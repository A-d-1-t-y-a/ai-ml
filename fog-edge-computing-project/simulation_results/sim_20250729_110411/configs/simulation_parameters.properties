# Simulation Parameters for Smart Campus Scenario
# Based on the PureEdgeSim paper

# General simulation parameters
number_of_edge_devices=100
number_of_edge_datacenters=10
number_of_cloud_datacenters=1
simulation_duration=3600
update_interval=1

# Network parameters (in Mbps for bandwidth, ms for latency)
wan_bandwidth=100.0
wan_latency=100.0
lan_bandwidth=1000.0
lan_latency=5.0

# Mobility parameters
mobility_enabled=true
min_mobility_speed=1.0
max_mobility_speed=1.4
pause_time=10

# Applications parameters
task_generation_rate=6
task_length=1000
task_input_size=100
task_output_size=10

# Orchestration parameters
orchestration_algorithm=FuzzyDecisionTree
enable_orchestration_logging=true

# Energy parameters
enable_energy_model=true
battery_replacement_policy=none

# Display parameters
display_real_time_charts=true
display_real_time_map=true
