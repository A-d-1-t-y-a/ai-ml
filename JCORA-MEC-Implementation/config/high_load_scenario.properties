# JCORA-MEC High Load Simulation Configuration

# Simulation parameters
simulation.duration = 100.0
simulation.timeStep = 1.0
simulation.taskGenerationProbability = 0.4  # Higher task generation probability
simulation.outputDir = output
simulation.scenarioName = high_load

# IoT device parameters
simulation.devices.count = 8  # More devices
simulation.devices.default.processingPower = 500.0
simulation.devices.default.energyConsumption = 2.0
simulation.devices.default.idleEnergyConsumption = 0.5
simulation.devices.default.transmissionPower = 1.0
simulation.devices.default.batteryCapacity = 5000.0

# Individual device configurations (override defaults)
simulation.device.0.name = Smartphone-1
simulation.device.0.processingPower = 600.0
simulation.device.0.batteryCapacity = 4000.0

simulation.device.1.name = Tablet-1
simulation.device.1.processingPower = 800.0
simulation.device.1.batteryCapacity = 6000.0

simulation.device.2.name = SmartWatch-1
simulation.device.2.processingPower = 300.0
simulation.device.2.batteryCapacity = 2000.0

simulation.device.3.name = SmartCamera-1
simulation.device.3.processingPower = 400.0
simulation.device.3.batteryCapacity = 3500.0

simulation.device.4.name = SmartSensor-1
simulation.device.4.processingPower = 200.0
simulation.device.4.batteryCapacity = 3000.0

simulation.device.5.name = Smartphone-2
simulation.device.5.processingPower = 650.0
simulation.device.5.batteryCapacity = 4200.0

simulation.device.6.name = Tablet-2
simulation.device.6.processingPower = 850.0
simulation.device.6.batteryCapacity = 6500.0

simulation.device.7.name = SmartCamera-2
simulation.device.7.processingPower = 450.0
simulation.device.7.batteryCapacity = 3800.0

# Edge server parameters
simulation.servers.count = 3
simulation.servers.default.processingPower = 2000.0
simulation.servers.default.energyConsumption = 5.0
simulation.servers.default.idleEnergyConsumption = 2.0
simulation.servers.default.maxBandwidth = 100.0
simulation.servers.default.maxConnections = 10

# Individual server configurations (override defaults)
simulation.server.0.name = EdgeServer-Small
simulation.server.0.processingPower = 1500.0
simulation.server.0.maxBandwidth = 80.0
simulation.server.0.maxConnections = 8

simulation.server.1.name = EdgeServer-Medium
simulation.server.1.processingPower = 2500.0
simulation.server.1.maxBandwidth = 120.0
simulation.server.1.maxConnections = 12

simulation.server.2.name = EdgeServer-Large
simulation.server.2.processingPower = 3500.0
simulation.server.2.maxBandwidth = 150.0
simulation.server.2.maxConnections = 15

# DRL agent parameters
drl.stateSize = 10
drl.actionSize = 4
drl.gamma = 0.95
drl.epsilon = 1.0
drl.epsilonMin = 0.01
drl.epsilonDecay = 0.995
drl.batchSize = 32
drl.replayMemorySize = 1000
drl.targetNetworkUpdateFreq = 100

# Reward calculation parameters
# Higher energy weight for high load scenario to prioritize energy efficiency
reward.maxEnergy = 150.0  # Higher max energy for normalization in high load
reward.maxTime = 15.0    # Higher max time for normalization in high load
reward.energyWeight = 0.6  # Prioritize energy efficiency more
reward.timeWeight = 0.4    # Slightly less emphasis on time
reward.deadlineBonus = 1.2  # Higher bonus for meeting deadlines
reward.deadlinePenalty = 1.5  # Higher penalty for missing deadlines
