# Fog-Edge Computing Simulation Configuration
# National College of Ireland - H9FEC: Fog and Edge Computing

# Simulation parameters
simulation.duration = 3600000
simulation.tickInterval = 1000

# Device counts
devices.iot.count = 50
devices.edge.count = 10
devices.fog.count = 5
devices.cloud.count = 1

# IoT device parameters
devices.iot.cpuCores = 1
devices.iot.ramMB = 512
devices.iot.storageMB = 4096
devices.iot.batteryCapacity = 5000
devices.iot.wirelessTypes = WIFI,BLUETOOTH,ZIGBEE,LORA
devices.iot.mobilityEnabled = true
devices.iot.mobilityPercentage = 30

# Edge node parameters
devices.edge.cpuCores = 4
devices.edge.ramMB = 8192
devices.edge.storageMB = 102400
devices.edge.batteryCapacity = 10000
devices.edge.wirelessTypes = WIFI,CELLULAR_4G,CELLULAR_5G
devices.edge.mobilityEnabled = false

# Fog node parameters
devices.fog.cpuCores = 8
devices.fog.ramMB = 16384
devices.fog.storageMB = 512000
devices.fog.batteryCapacity = 0
devices.fog.wirelessTypes = WIFI,CELLULAR_4G,CELLULAR_5G,ETHERNET
devices.fog.mobilityEnabled = false

# Cloud datacenter parameters
devices.cloud.cpuCores = 64
devices.cloud.ramMB = 131072
devices.cloud.storageMB = 10485760
devices.cloud.batteryCapacity = 0
devices.cloud.wirelessTypes = ETHERNET
devices.cloud.mobilityEnabled = false

# Network parameters
network.defaultBandwidthMbps = 100
network.defaultLatencyMs = 20
network.congestionProbability = 0.1
network.packetLossProbability = 0.05
network.iot.bandwidthMbps = 10
network.iot.latencyMs = 50
network.edge.bandwidthMbps = 50
network.edge.latencyMs = 20
network.fog.bandwidthMbps = 200
network.fog.latencyMs = 10
network.cloud.bandwidthMbps = 1000
network.cloud.latencyMs = 100

# Task parameters
tasks.generationInterval = 5000
tasks.minSizeKB = 10
tasks.maxSizeKB = 1000
tasks.minInstructionsMillions = 10
tasks.maxInstructionsMillions = 1000
tasks.offloadingEnabled = true
tasks.offloadingThreshold = 500

# Security parameters
security.attacksEnabled = true
security.attackProbability = 0.1
security.attackTypes = DOS,MITM,INJECTION,EAVESDROPPING,PHYSICAL
security.countermeasuresEnabled = true
security.countermeasureTypes = ENCRYPTION,AUTHENTICATION,INTRUSION_DETECTION,FIREWALL,ACCESS_CONTROL

# Logging parameters
logging.consoleEnabled = true
logging.fileEnabled = true
logging.filePath = logs/simulation.log
logging.minLevel = INFO
