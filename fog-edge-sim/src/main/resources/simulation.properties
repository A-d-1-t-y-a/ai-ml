# Fog and Edge Computing Simulation Configuration
# Based on "An Overview of Fog Computing and Edge Computing Security and Privacy Issues" (Sensors 2021)

# Simulation parameters
simulation.duration = 3600
simulation.area.size = 1000
simulation.random.seed = 12345

# Device counts
device.iot.count = 100
device.edge.count = 10
device.fog.count = 5
device.cloud.count = 2

# IoT device parameters
device.iot.mobility.percentage = 30
device.iot.battery.capacity = 5000
device.iot.cpu.capacity = 500
device.iot.ram.capacity = 512
device.iot.storage.capacity = 4
device.iot.task.generation.rate = 0.1
device.iot.wireless.types = WIFI,BLUETOOTH,ZIGBEE,CELLULAR

# Edge node parameters
device.edge.cpu.capacity = 2000
device.edge.ram.capacity = 4096
device.edge.storage.capacity = 128
device.edge.battery.capacity = 10000
device.edge.max.connections = 20

# Fog node parameters
device.fog.cpu.capacity = 5000
device.fog.ram.capacity = 8192
device.fog.storage.capacity = 512
device.fog.battery.capacity = 20000
device.fog.max.connections = 50

# Cloud datacenter parameters
device.cloud.cpu.capacity = 20000
device.cloud.ram.capacity = 65536
device.cloud.storage.capacity = 10240
device.cloud.max.connections = 200

# Task parameters
task.min.cpu = 100
task.max.cpu = 1000
task.min.ram = 64
task.max.ram = 1024
task.min.storage = 1
task.max.storage = 100
task.min.duration = 10
task.max.duration = 300
task.offloading.enabled = true
task.offloading.threshold = 0.7
task.scheduling.policy = PRIORITY
task.output.size = 512

# Network parameters
network.base.bandwidth = 100
network.base.latency = 10
network.variability.factor = 0.2
network.congestion.probability = 0.05
network.packet.loss.probability = 0.01
network.iot.mesh.enabled = false
network.edge.mesh.enabled = true
network.fog.mesh.enabled = true

# Security parameters
security.attacks.enabled = true
security.attack.probability = 0.02
security.detection.probability = 0.8
security.mitigation.probability = 0.7
security.attack.types = DOS,MITM,DATA_BREACH,MALWARE
security.countermeasure.types = ENCRYPTION,AUTHENTICATION,IDS,FIREWALL

# Logging parameters
logging.console.enabled = true
logging.file.enabled = true
logging.file.path = simulation_log.txt
logging.min.level = INFO
