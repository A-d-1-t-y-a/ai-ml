# Fog and Edge Computing Simulation Configuration

# Simulation parameters
simulation.duration=1000
simulation.areaSize=1000
simulation.randomSeed=12345

# Device counts
device.iotCount=100
device.edgeCount=10
device.fogCount=5
device.cloudCount=1

# IoT device parameters
iot.mobilityPercentage=30
iot.batteryCapacity=5000
iot.cpuCapacity=1000
iot.ramCapacity=512
iot.storageCapacity=1024
iot.taskGenerationRate=0.2
iot.wirelessTypes=BLUETOOTH,WIFI,CELLULAR,ZIGBEE,LORA

# Edge node parameters
edge.cpuCapacity=5000
edge.ramCapacity=8192
edge.storageCapacity=51200
edge.batteryCapacity=20000
edge.maxConnections=20

# Fog node parameters
fog.cpuCapacity=10000
fog.ramCapacity=32768
fog.storageCapacity=102400
fog.batteryCapacity=50000
fog.maxConnections=50

# Cloud datacenter parameters
cloud.cpuCapacity=100000
cloud.ramCapacity=1048576
cloud.storageCapacity=10485760
cloud.maxConnections=1000

# Task parameters
task.minCpu=100
task.maxCpu=1000
task.minRam=64
task.maxRam=1024
task.minStorage=128
task.maxStorage=4096
task.minDuration=5
task.maxDuration=50
task.offloadingEnabled=true
task.offloadingThreshold=0.8

# Network parameters
network.baseBandwidth=100
network.baseLatency=10
network.variabilityFactor=0.2
network.congestionProbability=0.1
network.packetLossProbability=0.05

# Mesh network configuration
network.iotMeshEnabled=true
network.edgeMeshEnabled=true
network.fogMeshEnabled=true

# Security parameters
security.attacksEnabled=true
security.attackProbability=0.05
security.detectionProbability=0.7
security.mitigationProbability=0.6
security.attackTypes=DDOS,DATA_THEFT,EAVESDROPPING,MAN_IN_THE_MIDDLE,MALWARE,PHYSICAL_TAMPERING
security.countermeasureTypes=TRAFFIC_FILTERING,ENCRYPTION,SECURE_COMMUNICATION,AUTHENTICATION,MALWARE_SCANNING,PHYSICAL_SECURITY,INTRUSION_DETECTION

# Logging parameters
logging.consoleEnabled=true
logging.fileEnabled=true
logging.filePath=logs/simulation.log
logging.minLevel=INFO
